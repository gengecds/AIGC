engine:
  image_provider: comfyui
  video_provider: comfyui
  video_engine: ltx_mlx
  llm_provider: deepseek
  llm_deepseek_fallback: true
  llm_model_script: deepseek-v4-flash
  llm_model_storyboard: deepseek-v4-pro
comfyui:
  server_addr: 127.0.0.1
  server_port: 8188
  ckpt_name: flux1-dev-Q5_K_S.gguf
  model_type: flux
  use_https: false
  timeout: 1800
  # IP-Adapter 角色一致性参数（底模 SD1.5）。preset 必须是 ComfyUI 里
  # IPAdapterUnifiedLoader / IPAdapterUnifiedLoaderFaceID 暴露的预设名。
  # 单个风格可写 styles.<风格名>.ipadapter 段，按同名字段局部覆盖。
  ipadapter:
    enabled: true                     # 自动出图链路启用 IP-Adapter（仅 SD1.5 引擎生效，FLUX 自动跳过）
    kind: ipadapter_faceid            # 走哪套模板：ipadapter | ipadapter_faceid
    # preset 须写 ComfyUI 里的全名，简称会 400（候选见下方注释）
    preset: PLUS (high strength)      # ipadapter: LIGHT - SD1.5 only (low strength) | STANDARD (medium strength) | VIT-G (medium strength) | PLUS (high strength) | PLUS FACE (portraits) | FULL FACE - SD1.5 only (portraits stronger)
    weight: 0.7                       # 参考图整体影响强度
    faceid_preset: FACEID PLUS V2     # ipadapter_faceid: FACEID | FACEID PLUS - SD1.5 only | FACEID PLUS V2 | FACEID PORTRAIT (style transfer) | FACEID PORTRAIT UNNORM - SDXL only (strong)
    faceid_weight: 0.5                # FaceID 人脸强度（过高会把任何构图拉成人物特写）
    faceid_weight_faceidv2: 0.5       # FACEID PLUS V2 专用强度，仅 faceid_preset 为该档时生效
    faceid_lora_strength: 0.6         # FaceID 配套 LoRA 强度，0 = 不加载
    provider: CPU                     # insightface 推理后端：CPU | CUDA | ROCM | DirectML | OpenVINO | CoreML
tts:
  engine: voxcpm
  voice_prompt: 温柔甜美年轻女声，柔和有亲和力
ollama:
  server_url: http://localhost:11434
  model: qwen3:8b
  num_ctx: 8192
