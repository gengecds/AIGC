storage:
  checkpoint_dir: storage/checkpoints/
  output_dir: storage/output/
  images_dir: storage/images/
  frames_dir: storage/frames_tmp/
pipeline:
  max_retries: 3
  retry_delay: 2.0
  review_enabled: true
  default_model: deepseek-v4-flash
# 出图质量自评闭环：生成图 → 视觉模型打 tag → 按 tag 算分 → 不达标自动重生成
image_qc:
  enabled: true
  model: deepseek-v4-flash
  threshold: 75
  max_retries: 2
frontend:
  host: 127.0.0.1
  port: 8888
  debug: true
intel:
  enabled: true
  source_dir: storage/intel/source/
  cases_dir: storage/intel/cases/
