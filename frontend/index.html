<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 漫剧制作平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ 顶栏（原型 header） ═══ -->
<header class="header">
  <div class="logo"><span>AI</span> 漫剧制作平台</div>
  <div class="actions">
    <span class="server-status" id="serverStatus"><span class="status-dot"></span>GPU 在线</span>
    <button onclick="toggleDrawer()">📂 历史任务</button>
  </div>
</header>

<div class="layout">
  <!-- ═══ 左侧面板 ═══ -->
  <aside class="sidebar">
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('asset')">🏛️ 资产库</button>
      <button class="tab-btn" onclick="switchTab('task')">📋 任务概览</button>
    </div>
    <div id="tab-asset">
      <div style="font-size:11px;color:#555570;margin-bottom:6px">角色定妆照</div>
      <div class="asset-grid" id="assetChars"></div>
      <div style="font-size:11px;color:#555570;margin:10px 0 6px">场景背景</div>
      <div class="asset-grid" id="assetScenes"></div>
    </div>
    <div id="tab-task" style="display:none">
      <div class="task-overview" id="taskOverview">
        <div class="overview-item"><span>剧名</span><strong id="ovTitle">—</strong></div>
        <div class="overview-item"><span>集数</span><strong id="ovEpisodes">—</strong></div>
        <div class="overview-item"><span>分镜</span><strong id="ovShots">—</strong></div>
        <div class="overview-item"><span>状态</span><strong id="ovStatus" style="color:#6c5ce7">空闲</strong></div>
        <div class="overview-item"><span>耗时</span><strong id="ovTime">—</strong></div>
        <div class="overview-item"><span>预估剩余</span><strong id="ovRemain">—</strong></div>
        <div style="margin-top:10px;font-size:11px;color:#555570">Checkpoint</div>
        <div id="checkpointList"></div>
      </div>
    </div>
  </aside>

  <!-- ═══ 主内容区 ═══ -->
  <div class="main">
    <div class="main-scroll" id="mainScroll">

      <!-- 输入区 -->
      <div class="input-area">
        <div class="row">
          <textarea id="storyInput" rows="3" placeholder="键入你的故事，如：一个程序员穿越到全是猫娘的世界…">一个程序员穿越到全是猫娘的世界，被当成稀有物种保护起来</textarea>
          <div class="controls">
            <select class="style-select" id="stylePicker">
              <option>🎨 写实</option>
              <option>二次元</option>
              <option>水墨风</option>
              <option>赛博朋克</option>
            </select>
            <button class="start-btn" id="generateBtn">🚀 开始制作</button>
            <button class="stop-btn" id="stopBtn">⏹ 停止</button>
          </div>
        </div>
      </div>

      <!-- 7 卡片 -->
      <div class="cards-row" id="cardRow">
        <div class="card state-idle" data-agent="script" onclick="selectCard('script')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(108,92,231,.3))">📝</div>
          <div class="title">剧本</div>
          <div class="status-text" id="status-script">空闲</div>
        </div>
        <div class="card state-idle" data-agent="storyboard" onclick="selectCard('storyboard')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(9,132,227,.3))">📋</div>
          <div class="title">分镜</div>
          <div class="status-text" id="status-storyboard">空闲</div>
        </div>
        <div class="card state-idle" data-agent="character" onclick="selectCard('character')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(232,67,147,.3))">🎭</div>
          <div class="title">定妆照</div>
          <div class="status-text" id="status-character">空闲</div>
        </div>
        <div class="card state-idle" data-agent="image" onclick="selectCard('image')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(0,184,148,.3))">🖼️</div>
          <div class="title">出图</div>
          <div class="status-text" id="status-image">空闲</div>
        </div>
        <div class="card state-idle" data-agent="video" onclick="selectCard('video')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(253,203,110,.3))">🎬</div>
          <div class="title">视频</div>
          <div class="status-text" id="status-video">空闲</div>
        </div>
        <div class="card state-idle" data-agent="subtitle" onclick="selectCard('subtitle')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(99,110,114,.3))">📄</div>
          <div class="title">字幕</div>
          <div class="status-text" id="status-subtitle">空闲</div>
        </div>
        <div class="card state-idle" data-agent="compose" onclick="selectCard('compose')">
          <div class="icon" style="filter:drop-shadow(0 0 4px rgba(214,48,49,.3))">📦</div>
          <div class="title">合成</div>
          <div class="status-text" id="status-compose">空闲</div>
        </div>
      </div>

      <!-- 进度条 -->
      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text">
        <span id="progressText">空闲</span>
        <span id="progressPct">0% (0/7 Agent)</span>
      </div>

      <!-- 详情区（动态渲染） -->
      <div class="detail-area" id="detailArea"><div class="placeholder">👈 点击上方卡片查看详情</div></div>

      <!-- 日志区 -->
      <div class="log-header"><span>📋 日志 <span id="logCount">0</span></span><button onclick="toggleLog()">收起 ▾</button></div>
      <div class="log-area" id="logArea"></div>

    </div>
  </div>
</div>

<!-- 历史任务抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="historyDrawer">
  <button class="close-btn" onclick="toggleDrawer()">✕</button>
  <h3>📂 历史任务</h3>
  <div id="historyList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
