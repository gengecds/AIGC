# ═══ 风格 · 视觉风格词库（横跨出图/出视频，可逐项或合并注入）═══
# 定位：决定"画面长什么样"的视觉调性。与 image/topic、video/genre 同为"自动匹配的词块库"，
#        但层级更高——它是"叠加在题材/内容之上"的修饰层，可单选也可多风格合并
#        （如"赛博朋克 + 国风古风 = 赛博朋克国风"）。
# 说明：
#   * 只收录"真正定义画面风格"的条目——视觉美学 / 动画3D / 艺术流派与电影感。
#   * 内容/情感类（剧情·沙雕·高燃·悬疑·温情）已由 video/genre 承载，
#     实用/功能类（纪实·口播·教程·混剪）已由 video/use 承载，此处不重复。
# 词条结构：{zh, en, note}；resolver 只取 en 拼接，zh/note 供人工阅读理解。
# 合并：merge_styles("赛博朋克","国风古风") → 取两者 words 的 en 并集拼接。

groups:
# ─────────────────────────────
# 一、视觉/美学类
# ─────────────────────────────
- name: 国风古风
  en: "chinese traditional / guofeng"
  neg: "western oil painting, modern graphic, grime"
  words:
  - zh: "工笔彩绘"
    en: "fine brushwork gongbi painting, delicate line and mineral pigment, elegant traditional color palette"
  - zh: "敦煌壁画"
    en: "dunhuang mural style, cinnabar and azurite palette, weathered cracked wall texture, ancient fresco patina"
  - zh: "汉服古建"
    en: "hanfu robes, ancient chinese architecture, upturned eaves, carved wooden lattice, misty mountains backdrop"
